name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.88.0, stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo +${{ matrix.toolchain }} fmt --all --check
      - run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --workspace
      - if: matrix.toolchain == '1.88.0'
        run: cargo +1.88.0 build --workspace --release

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable test --workspace
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - run: cargo +1.88.0 build -p metafile-wasm --target wasm32-unknown-unknown --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: node scripts/build-wasm.mjs
        env:
          METAFILE_SKIP_CARGO_BUILD: "1"
      - run: node scripts/wasm-smoke.mjs
      - uses: browser-actions/setup-chrome@v1
      - run: node scripts/wasm-browser-smoke.mjs

  windows-reference:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425
      - uses: browser-actions/setup-chrome@v1
      - shell: pwsh
        run: dotnet build tools/windows-reference/MetafileReference.csproj --configuration Release
      - shell: pwsh
        run: ./scripts/windows-qualification.ps1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-reference-diffs
          path: artifacts/qualification
